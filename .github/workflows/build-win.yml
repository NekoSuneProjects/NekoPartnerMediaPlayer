name: (Windows x64) Release Build & Upload NekosMediaPlayer

permissions:
  contents: write

on:
  push:
    branches:
      - RELEASE
      - BETA

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ FIXED Node version (LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm

      # ✅ Clean install (prevents Windows issues)
      - name: Install Dependencies
        shell: pwsh
        run: |
          npm install

      # ✅ Get version from package.json
      - name: Get Version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          echo "BASE_VERSION=$version" >> $env:GITHUB_ENV
          
     # ✅ Determine BETA or RELEASE
      - name: Determine Channel + Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "BETA") {
            $channel = "beta"

            $tag = "BETA-${{ github.run_number }}"
            $version = "$($env:BASE_VERSION)-beta-${{ github.run_number }}"
            $name = "NekosMediaPlayer BETA V$($env:BASE_VERSION)-${{ github.run_number }}"
            $prerelease = "true"
          }
          else {
            $channel = "release"

            $tag = $env:BASE_VERSION
            $version = $env:BASE_VERSION
            $name = "NekosMediaPlayer $($env:BASE_VERSION)"
            $prerelease = "false"
          }

          echo "CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$name" >> $env:GITHUB_ENV
          echo "PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      # ✅ Build
      - name: Build Electron App
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        run: Get-ChildItem -Recurse dist
        shell: pwsh

      # ==============================
      # Release Notes
      # ==============================
      - name: Generate Release Notes
        id: notes
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ env.VERSION }}
          name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG }}

      - name: Save Release Notes
        shell: pwsh
        run: |
          Set-Content -Path release_notes.txt -Value "${{ steps.notes.outputs.body }}"

      # ==============================
      # GitHub Release (FIXED)
      # ==============================
      - name: Create Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ${{ steps.notes.outputs.body }}

            **EXE Installer**
            https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.exe

            **MSI Installer**
            https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.msi
          files: |
            dist/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.exe
            dist/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.msi
          overwrite: true   # 🔥 prevents duplicate tag crash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Discord Notification
      # ==============================
      - name: Send Release Info to Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          $notes = Get-Content release_notes.txt -Raw

          $exeUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.exe"
          $msiUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/NekosMediaPlayer-Setup-${{ env.BASE_VERSION }}.msi"

          $json = @{
            username = "NekosMediaPlayer Bot"
            content = "<@&1384262560395559122> **NEW RELEASE (WINDOWS)**"
            embeds = @(
              @{
                title = "$env:RELEASE_NAME"
                description = "$notes`n`n[Download EXE]($exeUrl) | [Download MSI]($msiUrl)"
                color = if ($env:CHANNEL -eq "beta") { 16750848 } else { 16776960 }
                timestamp = (Get-Date).ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $json
