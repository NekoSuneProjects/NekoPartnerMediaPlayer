name: (Linux x64/ARM) Release Build, Draft & Upload NekosMediaPlayer

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - RELEASE
      - BETA

jobs:
  build-and-upload-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm

      - name: Install Dependencies
        run: npm install

      # ==============================
      # Get Base Version
      # ==============================
      - name: Get Base Version
        run: echo "BASE_VERSION=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_ENV

      # ==============================
      # Determine Channel + Version (MATCH WINDOWS LOGIC)
      # ==============================
      - name: Determine Channel + Version
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "BETA" ]; then
            CHANNEL="beta"
            TAG="BETA-${GITHUB_RUN_NUMBER}"
            VERSION="${BASE_VERSION}-beta-${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="NekosMediaPlayer BETA v${BASE_VERSION}-${GITHUB_RUN_NUMBER}"
          else
            CHANNEL="release"
            TAG="${BASE_VERSION}"
            VERSION="${BASE_VERSION}"
            RELEASE_NAME="NekosMediaPlayer ${BASE_VERSION}"
          fi

          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      # ==============================
      # Build
      # ==============================
      - name: Enable QEMU for Cross Architecture Builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libarchive-tools

      - name: Build Electron App
        run: npm run build:linux-all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        run: ls -R dist

      # ==============================
      # Release Notes
      # ==============================
      - name: Create Release Notes
        run: |
          echo "**NekosMediaPlayer Release**" > release_notes.txt
          echo "" >> release_notes.txt
          echo "Version: $VERSION" >> release_notes.txt

      # ==============================
      # Discord Webhook
      # ==============================
      - name: Send Release Info to Discord (Linux)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RELEASE_NOTES=$(cat release_notes.txt)

          FILE_LIST=""
          for file in dist/*; do
            FILENAME=$(basename "$file")
            FILE_LIST+="• $FILENAME\n"
          done

          JSON=$(jq -n \
            --arg content "<@&1384262560395559122> **NEW RELEASE (LINUX ALL ARCHES)**" \
            --arg title "$RELEASE_NAME" \
            --arg description "$RELEASE_NOTES\n\n**Build Files:**\n$FILE_LIST" \
            --argjson color "$( [ "$CHANNEL" = "beta" ] && echo 16750848 || echo 65280 )" \
            --arg timestamp "$(date --iso-8601=seconds)" \
          '{
            username: "NekosMediaPlayer Bot",
            content: $content,
            embeds: [{
              title: $title,
              description: $description,
              color: $color,
              timestamp: $timestamp
            }]
          }')

          curl -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK"
